name: Bug report
description: Something broke in the demo, setup or bounded runner.
title: "bug: "
labels: [bug]
body:
  - type: checkboxes
    id: privacy
    attributes:
      label: Keep people and credentials out of this issue
      options:
        - label: This report contains no real profiles, messages, screenshots, device IDs, raw XML/logs, certificates or credentials.
          required: true
  - type: dropdown
    id: mode
    attributes:
      label: Where did it happen?
      options:
        - Offline demo
        - Synthetic tests
        - Windows setup or WDA packaging
        - Local real-device setup (describe without identifiers)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Minimal steps to reproduce
      description: Prefer the offline demo or a small synthetic fixture.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Relevant versions
      description: OS, Python, Node, Appium/XCUITest and iOS versions only; no device or account identifiers.
